<svg width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="1200" fill="#FFF8F1"/>
  <g transform="translate(0,320)">

  <text x="600" y="30" text-anchor="middle" font-family="'Arial Rounded MT Bold','Hiragino Sans',sans-serif" font-weight="700" font-size="30" fill="#2D2D2D">運動不足のサイン、出ていませんか？</text>

  <g transform="translate(200,180)">
    <rect x="-150" y="-70" width="300" height="140" rx="24" fill="#F6A54B"/>
    <text x="0" y="10" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-weight="700" font-size="26" fill="#FFFFFF">家具を噛む</text>
  </g>
  <g transform="translate(600,180)">
    <rect x="-150" y="-70" width="300" height="140" rx="24" fill="#F6A54B"/>
    <text x="0" y="10" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-weight="700" font-size="26" fill="#FFFFFF">無駄吠えが増える</text>
  </g>
  <g transform="translate(1000,180)">
    <rect x="-150" y="-70" width="300" height="140" rx="24" fill="#2D2D2D"/>
    <text x="0" y="10" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-weight="700" font-size="26" fill="#FFFFFF">夜眠りにくい</text>
  </g>

  <text x="600" y="330" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-size="22" fill="#2D2D2D" opacity="0.6">1つでも当てはまれば、室内での運動機会を見直すサインです</text>

  </g>
</svg>
