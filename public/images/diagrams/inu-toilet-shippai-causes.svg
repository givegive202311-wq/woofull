<svg width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="1200" fill="#FFF8F1"/>
  <g transform="translate(0,200)">

  <text x="600" y="40" text-anchor="middle" font-family="'Arial Rounded MT Bold','Hiragino Sans',sans-serif" font-weight="700" font-size="32" fill="#2D2D2D">トイレ失敗が続く、主な4つの原因</text>

  <g transform="translate(180,180)">
    <rect x="-120" y="-70" width="240" height="140" rx="24" fill="#F6A54B"/>
    <text x="0" y="-8" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-weight="700" font-size="24" fill="#FFFFFF">環境の変化</text>
    <text x="0" y="26" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-size="16" fill="#FFFFFF" opacity="0.9">家具移動・家族が増えた</text>
  </g>

  <g transform="translate(460,180)">
    <rect x="-120" y="-70" width="240" height="140" rx="24" fill="#F6A54B"/>
    <text x="0" y="-8" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-weight="700" font-size="24" fill="#FFFFFF">トイレへの不満</text>
    <text x="0" y="26" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-size="16" fill="#FFFFFF" opacity="0.9">汚れ・サイズが合わない</text>
  </g>

  <g transform="translate(740,180)">
    <rect x="-120" y="-70" width="240" height="140" rx="24" fill="#2D2D2D"/>
    <text x="0" y="-8" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-weight="700" font-size="24" fill="#FFFFFF">マーキング</text>
    <text x="0" y="26" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-size="16" fill="#FFFFFF" opacity="0.9">未去勢・未避妊に多い</text>
  </g>

  <g transform="translate(1020,180)">
    <rect x="-120" y="-70" width="240" height="140" rx="24" fill="#e53e3e"/>
    <text x="0" y="-8" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-weight="700" font-size="24" fill="#FFFFFF">体調不良</text>
    <text x="0" y="26" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-size="16" fill="#FFFFFF" opacity="0.9">頻尿・血尿は要受診</text>
  </g>

  <text x="600" y="340" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-size="20" fill="#2D2D2D" opacity="0.5">まず体調面を確認 → 環境とトイレ周りを見直す、が基本の順番です</text>

  </g>
</svg>
