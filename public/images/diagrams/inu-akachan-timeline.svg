<svg width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="1200" fill="#FFF8F1"/>
  <g transform="translate(0,340)">

  <text x="60" y="40" font-family="'Arial Rounded MT Bold','Hiragino Sans',sans-serif" font-weight="700" font-size="28" fill="#2D2D2D">出産前から始める準備タイムライン</text>

  <line x1="160" y1="200" x2="1040" y2="200" stroke="#F6A54B" stroke-width="4" stroke-dasharray="2 14" stroke-linecap="round"/>

  <g transform="translate(160,200)"><circle r="60" fill="#F6A54B"/></g>
  <text x="160" y="290" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-weight="700" font-size="21" fill="#2D2D2D">生活リズムを</text>
  <text x="160" y="316" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-weight="700" font-size="21" fill="#2D2D2D">少しずつ変える</text>

  <g transform="translate(453,200)"><circle r="60" fill="#F6A54B"/></g>
  <text x="453" y="290" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-weight="700" font-size="21" fill="#2D2D2D">赤ちゃんの匂い・</text>
  <text x="453" y="316" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-weight="700" font-size="21" fill="#2D2D2D">泣き声に慣らす</text>

  <g transform="translate(746,200)"><circle r="60" fill="#F6A54B"/></g>
  <text x="746" y="290" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-weight="700" font-size="21" fill="#2D2D2D">犬専用スペースを</text>
  <text x="746" y="316" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-weight="700" font-size="21" fill="#2D2D2D">見直す</text>

  <g transform="translate(1040,200)"><circle r="60" fill="#2D2D2D"/></g>
  <text x="1040" y="290" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-weight="700" font-size="21" fill="#2D2D2D">基本のしつけを</text>
  <text x="1040" y="316" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-weight="700" font-size="21" fill="#2D2D2D">見直す</text>

  <text x="600" y="400" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-size="20" fill="#2D2D2D" opacity="0.45">妊娠中の落ち着いた時期から、少しずつ進めるのがポイントです</text>

  </g>
</svg>
