<svg width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="1200" fill="#FFF8F1"/>
  <g transform="translate(0,300)">

  <text x="600" y="40" text-anchor="middle" font-family="'Arial Rounded MT Bold','Hiragino Sans',sans-serif" font-weight="700" font-size="30" fill="#2D2D2D">うちの子はどっちタイプ？</text>

  <g transform="translate(600,150)">
    <circle r="70" fill="#2D2D2D"/>
    <text x="0" y="-4" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-weight="700" font-size="22" fill="#FFFFFF">狭い場所</text>
    <text x="0" y="24" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-weight="700" font-size="22" fill="#FFFFFF">好き？</text>
  </g>

  <line x1="540" y1="200" x2="280" y2="330" stroke="#F6A54B" stroke-width="4"/>
  <line x1="660" y1="200" x2="920" y2="330" stroke="#F6A54B" stroke-width="4"/>

  <g transform="translate(280,380)">
    <rect x="-190" y="-40" width="380" height="80" rx="24" fill="#F6A54B"/>
    <text x="0" y="8" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-weight="700" font-size="24" fill="#FFFFFF">はい・寒がり</text>
  </g>
  <g transform="translate(280,480)">
    <rect x="-190" y="-50" width="380" height="100" rx="20" fill="#FFFFFF" stroke="#F6A54B" stroke-width="3"/>
    <text x="0" y="-8" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-weight="700" font-size="22" fill="#2D2D2D">包まれるクッション型</text>
    <text x="0" y="24" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-size="18" fill="#2D2D2D" opacity="0.6">小型犬・猫向け</text>
  </g>

  <g transform="translate(920,380)">
    <rect x="-190" y="-40" width="380" height="80" rx="24" fill="#F6A54B"/>
    <text x="0" y="8" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-weight="700" font-size="24" fill="#FFFFFF">いいえ・暑がり</text>
  </g>
  <g transform="translate(920,480)">
    <rect x="-190" y="-50" width="380" height="100" rx="20" fill="#FFFFFF" stroke="#F6A54B" stroke-width="3"/>
    <text x="0" y="-8" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-weight="700" font-size="22" fill="#2D2D2D">通気性メッシュコット型</text>
    <text x="0" y="24" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-size="18" fill="#2D2D2D" opacity="0.6">中型犬〜大型犬向け</text>
  </g>

  </g>
</svg>
