<svg width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="1200" fill="#FFF8F1"/>
  <g transform="translate(0,340)">

  <text x="600" y="30" text-anchor="middle" font-family="'Arial Rounded MT Bold','Hiragino Sans',sans-serif" font-weight="700" font-size="30" fill="#2D2D2D">使い方はたった2ステップ</text>

  <line x1="330" y1="220" x2="870" y2="220" stroke="#F6A54B" stroke-width="4" stroke-dasharray="2 14" stroke-linecap="round"/>

  <g transform="translate(330,220)">
    <circle r="70" fill="#F6A54B"/>
    <text x="0" y="20" text-anchor="middle" font-family="'Arial Rounded MT Bold',sans-serif" font-weight="700" font-size="56" fill="#FFFFFF">1</text>
  </g>
  <text x="330" y="340" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-weight="700" font-size="26" fill="#2D2D2D">気になる場所を転がす</text>

  <g transform="translate(870,220)">
    <circle r="70" fill="#2D2D2D"/>
    <text x="0" y="20" text-anchor="middle" font-family="'Arial Rounded MT Bold',sans-serif" font-weight="700" font-size="56" fill="#FFFFFF">2</text>
  </g>
  <text x="870" y="340" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-weight="700" font-size="26" fill="#2D2D2D">汚れたら水洗い</text>

  <text x="600" y="430" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-size="20" fill="#2D2D2D" opacity="0.45">粘着テープ不要で吸着力が復活。繰り返し使えます</text>

  </g>
</svg>
