<svg width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="1200" fill="#FFF8F1"/>
  <g transform="translate(0,180)">

  <text x="600" y="40" text-anchor="middle" font-family="'Arial Rounded MT Bold','Hiragino Sans',sans-serif" font-weight="700" font-size="32" fill="#2D2D2D">留守番前チェックリスト</text>

  <rect x="150" y="90" width="900" height="140" rx="24" fill="#F6A54B"/>
  <text x="600" y="150" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-weight="700" font-size="26" fill="#FFFFFF">目安は 室温25℃前後 ／ 湿度50％前後</text>
  <text x="600" y="195" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-size="20" fill="#FFFFFF" opacity="0.9">エアコンは人感センサー任せにしない</text>

  <g font-family="'Hiragino Sans',sans-serif" font-size="24" fill="#2D2D2D">
    <text x="150" y="300">☐ エアコンのタイマー・温度設定を確認した</text>
    <text x="150" y="350">☐ 新鮮な水をこぼれにくい器で複数用意した</text>
    <text x="150" y="400">☐ 直射日光が当たる場所にケージを置いていない</text>
    <text x="150" y="450">☐ カーテン・ブラインドで日差しを遮っている</text>
    <text x="150" y="500">☐ 出かける前に軽く運動させて落ち着かせた</text>
  </g>

  <text x="600" y="600" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-size="20" fill="#2D2D2D" opacity="0.45">冷凍おやつは「涼しく過ごす工夫のひとつ」。室温管理と水分補給が基本です</text>

  </g>
</svg>
