<svg width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="1200" fill="#FFF8F1"/>
  <g transform="translate(0,300)">

  <text x="600" y="30" text-anchor="middle" font-family="'Arial Rounded MT Bold','Hiragino Sans',sans-serif" font-weight="700" font-size="30" fill="#2D2D2D">ひとりで繰り返せる遊びのサイクル</text>

  <g transform="translate(300,220)">
    <circle r="80" fill="#F6A54B"/>
    <text x="0" y="8" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-weight="700" font-size="24" fill="#FFFFFF">ボール発射</text>
  </g>
  <text x="500" y="230" font-family="'Hiragino Sans',sans-serif" font-size="34" fill="#F6A54B">→</text>
  <g transform="translate(700,220)">
    <circle r="80" fill="#F6A54B"/>
    <text x="0" y="8" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-weight="700" font-size="24" fill="#FFFFFF">追いかける</text>
  </g>
  <text x="900" y="230" font-family="'Hiragino Sans',sans-serif" font-size="34" fill="#F6A54B">→</text>

  <text x="600" y="330" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-size="34" fill="#2D2D2D" opacity="0.3">↓</text>

  <g transform="translate(700,420)">
    <circle r="80" fill="#2D2D2D"/>
    <text x="0" y="8" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-weight="700" font-size="22" fill="#FFFFFF">ごほうび</text>
  </g>
  <text x="500" y="430" font-family="'Hiragino Sans',sans-serif" font-size="34" fill="#F6A54B">←</text>
  <g transform="translate(300,420)">
    <circle r="80" fill="#F6A54B"/>
    <text x="0" y="8" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-weight="700" font-size="24" fill="#FFFFFF">本体に戻す</text>
  </g>

  <text x="600" y="560" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-size="20" fill="#2D2D2D" opacity="0.45">この4つを犬が自分で繰り返すため、飼い主が投げ続ける必要はありません</text>

  </g>
</svg>
