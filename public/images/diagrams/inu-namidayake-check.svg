<svg width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="1200" fill="#FFF8F1"/>
  <g transform="translate(0,240)">

  <text x="600" y="40" text-anchor="middle" font-family="'Arial Rounded MT Bold','Hiragino Sans',sans-serif" font-weight="700" font-size="32" fill="#2D2D2D">ケアでいい？病院へ行くべき？</text>

  <rect x="60" y="90" width="500" height="440" rx="28" fill="#FFFFFF" stroke="#1D9E75" stroke-width="3"/>
  <circle cx="120" cy="150" r="26" fill="#1D9E75"/>
  <text x="120" y="159" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-weight="700" font-size="26" fill="#FFFFFF">◎</text>
  <text x="160" y="159" font-family="'Hiragino Sans',sans-serif" font-weight="700" font-size="26" fill="#1D9E75">自宅ケアで様子見できることが多い</text>

  <g font-family="'Hiragino Sans',sans-serif" font-size="22" fill="#2D2D2D">
    <text x="100" y="230">・毎日同じ程度の涙やけ</text>
    <text x="100" y="278">・目やにの色が透明〜白</text>
    <text x="100" y="326">・目をこすったりしない</text>
    <text x="100" y="374">・充血や腫れが無い</text>
    <text x="100" y="422" opacity="0.5" font-size="19">（体質的な要因のことが多い）</text>
  </g>

  <rect x="640" y="90" width="500" height="440" rx="28" fill="#FFFFFF" stroke="#e53e3e" stroke-width="3"/>
  <circle cx="700" cy="150" r="26" fill="#e53e3e"/>
  <text x="700" y="159" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-weight="700" font-size="22" fill="#FFFFFF">！</text>
  <text x="740" y="159" font-family="'Hiragino Sans',sans-serif" font-weight="700" font-size="26" fill="#e53e3e">動物病院での確認がおすすめ</text>

  <g font-family="'Hiragino Sans',sans-serif" font-size="22" fill="#2D2D2D">
    <text x="680" y="230">・涙の量が急に増えた</text>
    <text x="680" y="278">・目やにが黄色／緑色っぽい</text>
    <text x="680" y="326">・目を頻繁にこする・痛がる</text>
    <text x="680" y="374">・白目の充血、まぶたの腫れ</text>
    <text x="680" y="422" opacity="0.5" font-size="19">（片目だけの場合は特に注意）</text>
  </g>

  <text x="600" y="590" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-size="20" fill="#2D2D2D" opacity="0.45">拭き取りは目頭→目尻へ、乾いたティッシュでこすらないのが基本です</text>

  </g>
</svg>
