<svg width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="1200" fill="#FFF8F1"/>
  <g transform="translate(0,280)">

  <text x="60" y="80" font-family="'Arial Rounded MT Bold','Hiragino Sans',sans-serif" font-weight="700" font-size="34" fill="#2D2D2D">インターホンの音を「良いこと」に書き換える4ステップ</text>

  <!-- 接続線 -->
  <line x1="160" y1="300" x2="1040" y2="300" stroke="#F6A54B" stroke-width="4" stroke-dasharray="2 14" stroke-linecap="round"/>

  <!-- Step 1 -->
  <g transform="translate(160,300)">
    <circle r="66" fill="#F6A54B"/>
    <text x="0" y="20" text-anchor="middle" font-family="'Arial Rounded MT Bold',sans-serif" font-weight="700" font-size="56" fill="#FFFFFF">1</text>
  </g>
  <text x="160" y="410" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-weight="700" font-size="26" fill="#2D2D2D">小さい音量で再生</text>
  <text x="160" y="446" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-size="20" fill="#2D2D2D" opacity="0.6">反応しない音量から</text>

  <!-- Step 2 -->
  <g transform="translate(453,300)">
    <circle r="66" fill="#F6A54B"/>
    <text x="0" y="20" text-anchor="middle" font-family="'Arial Rounded MT Bold',sans-serif" font-weight="700" font-size="56" fill="#FFFFFF">2</text>
  </g>
  <text x="453" y="410" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-weight="700" font-size="26" fill="#2D2D2D">鳴ったら即おやつ</text>
  <text x="453" y="446" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-size="20" fill="#2D2D2D" opacity="0.6">吠える前のタイミングで</text>

  <!-- Step 3 -->
  <g transform="translate(746,300)">
    <circle r="66" fill="#F6A54B"/>
    <text x="0" y="20" text-anchor="middle" font-family="'Arial Rounded MT Bold',sans-serif" font-weight="700" font-size="56" fill="#FFFFFF">3</text>
  </g>
  <text x="746" y="410" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-weight="700" font-size="26" fill="#2D2D2D">少しずつ音量UP</text>
  <text x="746" y="446" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-size="20" fill="#2D2D2D" opacity="0.6">焦らず段階的に</text>

  <!-- Step 4 -->
  <g transform="translate(1040,300)">
    <circle r="66" fill="#2D2D2D"/>
    <text x="0" y="20" text-anchor="middle" font-family="'Arial Rounded MT Bold',sans-serif" font-weight="700" font-size="56" fill="#FFFFFF">4</text>
  </g>
  <text x="1040" y="410" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-weight="700" font-size="26" fill="#2D2D2D">本番で実践</text>
  <text x="1040" y="446" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-size="20" fill="#2D2D2D" opacity="0.6">実際のインターホンで</text>

  <text x="600" y="560" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-size="22" fill="#2D2D2D" opacity="0.45">数日〜数ヶ月かけて、焦らず繰り返すのがポイント</text>

  <g transform="translate(1120,60)" fill="#F6A54B" opacity="0.9">
    <path d="M0 8 C0 8, -20 12, -22 22 C-24 32, -16 40, 0 38 C16 40, 24 32, 22 22 C20 12, 0 8, 0 8Z" transform="scale(0.7)"/>
  </g>
  </g>
</svg>
